<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Comeback</title>
<style>
:root{
  --ink:#07080f;--panel:#11122a;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --tx:#f3f1fb;--mu:#9296b8;--mu2:#5f6388;
  --gold:#f6c560;--gold2:#ffe3a3;--gold3:#f19a3e;--rose:#ff8a9a;--teal:#6ee7d2;--violet:#b4a2ff;--sky:#8ccfff;--green:#9be7a6;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:24px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
h1,h2,h3,p{margin:0}

/* sky */
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(90% 45% at 85% -5%,rgba(246,197,96,.13),transparent 60%),
  radial-gradient(80% 50% at 0% 0%,rgba(120,100,255,.20),transparent 65%),
  radial-gradient(130% 70% at 50% -10%,#191a44 0%,#0c0d22 50%,var(--ink) 80%)}
.st{position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%}
.st2{animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}

main{max-width:560px;margin:0 auto;padding:calc(var(--st) + 22px) 18px calc(120px + var(--sb));animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* type */
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.gold{color:var(--gold)}
.mu{color:var(--mu)}.mu2{color:var(--mu2)}
.title{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.hello{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.hello em{font-style:italic;color:var(--gold2)}
.lede{color:var(--mu);font-size:14px;margin-bottom:20px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h3{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.sec a,.link{color:var(--gold);font-size:13px;font-weight:700;text-decoration:none}

/* cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 12px;position:relative}
.card.glow{border-color:rgba(246,197,96,.35);box-shadow:0 0 0 1px rgba(246,197,96,.08),0 20px 60px -20px rgba(246,197,96,.25)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:16px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line2);transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}a.btn{text-decoration:none;color:inherit}
.btn.gold-b{background:linear-gradient(135deg,var(--gold2),var(--gold) 45%,var(--gold3));color:#1b1206;border:0;box-shadow:0 10px 30px -10px rgba(246,197,96,.6)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:12px}
.btn.wide{width:100%}
.btn.danger{color:var(--rose)}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px 18px;margin:20px 0 14px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(246,197,96,.18),transparent 55%),radial-gradient(90% 90% at 0% 100%,rgba(140,110,255,.22),transparent 60%),linear-gradient(160deg,#17183a,#0e0f25);
  border:1px solid rgba(255,255,255,.1)}
.hero:after{content:'';position:absolute;left:-90px;bottom:-120px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(246,197,96,.12);box-shadow:0 0 0 26px rgba(246,197,96,.04),0 0 0 54px rgba(246,197,96,.025);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:16px}
.dayno{font-family:var(--serif);font-weight:600;line-height:.9;letter-spacing:-.04em;margin:6px 0 6px}
.dayno b{font-size:76px;font-weight:600;background:linear-gradient(180deg,#fff,var(--gold2) 70%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.dayno span{font-size:24px;color:var(--mu);margin-left:4px}
.phase{font-size:13px;color:#c9c6e6;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.fire{background:rgba(255,140,80,.14);border-color:rgba(255,160,90,.3);color:#ffc59a}
.chip.goldc{background:rgba(246,197,96,.12);border-color:rgba(246,197,96,.3);color:var(--gold2)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:4px;margin-top:18px}
.strip i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.1);position:relative}
.strip i.f{background:rgba(246,197,96,calc(.3 + .7*var(--f,0)));box-shadow:0 0 calc(6px*var(--f,0)) rgba(246,197,96,.7)}
.strip i.miss{background:rgba(255,255,255,.18)}
.strip i.now{outline:1.5px solid var(--gold2);outline-offset:1.5px}

/* ring */
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;display:block}
.rbg{fill:none;stroke:rgba(255,255,255,.09)}
.rfg{fill:none;stroke:url(#gg);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,.9,.3,1)}
.rin{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rin b{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.rin b small{font-size:15px;color:var(--mu);font-weight:500}
.rin>span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:3px}

/* now */
.now{display:flex;gap:14px;align-items:flex-start}
.now-ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.now h2{font-size:18px;font-weight:700;line-height:1.25;margin:2px 0}
.pbar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin:10px 0 4px}
.pbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--violet),var(--gold))}
.next{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2);font-size:13px;color:var(--mu)}
.next b{color:var(--tx)}

/* missions */
.missions{display:flex;flex-direction:column;gap:10px}
.mission{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:14px 14px 14px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);position:relative;transition:background .25s,border-color .25s,transform .12s}
.mission:active{transform:scale(.985)}
.mi-ic{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.mi-tx{flex:1;min-width:0}
.mi-tx b{display:block;font-size:15px;font-weight:700;line-height:1.3}
.mi-tx small{display:block;font-size:12.5px;color:var(--mu);margin-top:2px}
.mi-ck{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#1b1206;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.mi-ck svg{opacity:0;transform:scale(.3);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.mission.done{background:linear-gradient(90deg,rgba(246,197,96,.09),rgba(246,197,96,.02));border-color:rgba(246,197,96,.22)}
.mission.done .mi-tx b{color:#cfcbe6;text-decoration:line-through;text-decoration-color:rgba(246,197,96,.55);text-decoration-thickness:1.5px}
.mission.done .mi-ck{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;box-shadow:0 0 18px rgba(246,197,96,.55)}
.mission.done .mi-ck svg{opacity:1;transform:none}
.mission .go{position:absolute;right:56px;top:50%;transform:translateY(-50%)}

/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;transition:opacity .3s,transform .3s}
.task.gone{opacity:0;transform:translateX(30px)}
.tck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex:none;display:grid;place-items:center;color:#1b1206}
.tck.on{background:var(--gold);border-color:var(--gold)}
.tt{flex:1;min-width:0;text-align:left}
.tt b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tt small{font-size:12px;color:var(--mu)}
.due-bad{color:var(--rose)!important}.due-today{color:var(--gold)!important}
.add{display:flex;gap:8px;margin-bottom:6px}
.field{width:100%;min-height:48px;padding:12px 15px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line2);outline:0;transition:border-color .2s,background .2s}
.field:focus{border-color:var(--gold);background:rgba(255,255,255,.07)}
textarea.field{min-height:84px;resize:vertical}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
input[type=date].field{color-scheme:dark}
label.lb{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:16px 2px 8px}

/* pill select */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line2);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold))}
.pill.on{background:rgba(246,197,96,.15);border-color:var(--gold);color:var(--gold2)}

/* tabs */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sb));z-index:30;width:min(94vw,460px);display:flex;align-items:center;justify-content:space-around;padding:7px;border-radius:28px;background:rgba(18,19,40,.78);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line2);box-shadow:0 20px 50px -10px rgba(0,0,0,.7)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:20px;color:var(--mu2);font-size:10.5px;font-weight:800;letter-spacing:.04em;transition:color .2s}
.tab.on{color:var(--gold2)}
.tab.on svg{filter:drop-shadow(0 0 8px rgba(246,197,96,.6))}
.tab-orb{width:58px;height:58px;margin:-26px 6px 0;border-radius:50%;flex:none;display:grid;place-items:center;color:#1b1206;background:radial-gradient(circle at 35% 30%,#fff4d6,var(--gold) 50%,var(--gold3));box-shadow:0 0 0 6px rgba(7,8,15,.9),0 10px 30px rgba(246,197,96,.45)}
.tab-orb.live{animation:orb 2s ease-in-out infinite}
@keyframes orb{50%{box-shadow:0 0 0 6px rgba(7,8,15,.9),0 0 38px rgba(246,197,96,.85)}}

/* sheet */
#sw{position:fixed;inset:0;z-index:40;pointer-events:none}
#sbg{position:absolute;inset:0;background:rgba(3,3,10,.66);opacity:0;transition:opacity .3s;backdrop-filter:blur(3px)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#16173a,#0f1026);border:1px solid var(--line2);border-bottom:0;border-radius:30px 30px 0 0;padding:8px 20px calc(26px + var(--sb));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.25,1)}
#sw.on{pointer-events:auto}#sw.on #sbg{opacity:1}#sw.on #sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:4px auto 16px}
.sh-title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.02em}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translate(-50%,-220%);z-index:60;width:min(92vw,420px);padding:14px 16px;border-radius:20px;background:rgba(26,27,58,.95);border:1px solid rgba(246,197,96,.35);box-shadow:0 20px 50px rgba(0,0,0,.6);backdrop-filter:blur(16px);transition:transform .45s cubic-bezier(.2,1.3,.4,1);display:flex;gap:12px;align-items:center}
#toast.on{transform:translate(-50%,0)}
#toast .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(246,197,96,.15);color:var(--gold);flex:none}
#toast b{display:block;font-size:15px}#toast span{font-size:13px;color:var(--mu)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.xpop{position:fixed;z-index:65;pointer-events:none;font-weight:800;font-size:14px;color:var(--gold2);text-shadow:0 0 12px rgba(246,197,96,.8);animation:xp 1s ease-out forwards}
@keyframes xp{from{opacity:0;transform:translateY(4px) scale(.8)}20%{opacity:1;transform:translateY(-6px) scale(1.1)}to{opacity:0;transform:translateY(-40px)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 14px}
.stat{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-size:clamp(20px,6.4vw,30px);white-space:nowrap;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mu);font-weight:600}
.stat.hl b{color:var(--gold2)}

/* constellation */
.sky-card{padding:10px 6px 8px;overflow:hidden;background:radial-gradient(100% 60% at 50% 0%,rgba(120,100,255,.14),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015))}
.sky-card svg{width:100%;height:auto;display:block}
.cl-line{stroke:rgba(255,255,255,.09);stroke-width:1.2;stroke-dasharray:2 4}
.cl-line.lit{stroke:rgba(246,197,96,.55);stroke-dasharray:none;stroke-width:1.4}
.wl{fill:var(--mu2);font:700 9px var(--sans);letter-spacing:.08em}
.pulse{fill:none;stroke:var(--gold2);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pl 2s ease-out infinite}
@keyframes pl{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:11.5px;color:var(--mu);margin:4px 0 2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* bars */
.hb{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:13px;margin:10px 0}
.hb em{font-style:normal;text-align:right;color:var(--mu);font-weight:700;font-size:12px}
.hb .pbar{margin:0}
.wbars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
.wbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--mu);font-weight:700}
.wbar i{width:100%;border-radius:8px;background:linear-gradient(180deg,var(--violet),rgba(180,162,255,.35));min-height:4px}
.wbar.today i{background:linear-gradient(180deg,var(--gold2),var(--gold3))}
.wbar.today{color:var(--gold2)}
.heat{display:grid;grid-template-columns:repeat(17,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.06)}

/* phases */
.phases{display:flex;flex-direction:column;gap:0}
.ph{display:flex;gap:14px;align-items:flex-start;padding:10px 0;position:relative}
.ph-d{width:14px;height:14px;border-radius:50%;border:2px solid var(--mu2);flex:none;margin-top:3px;background:var(--ink);position:relative;z-index:1}
.ph:not(:last-child):before{content:'';position:absolute;left:6px;top:24px;bottom:-6px;width:2px;background:var(--line2)}
.ph.done .ph-d{background:var(--gold);border-color:var(--gold)}
.ph.cur .ph-d{border-color:var(--gold);box-shadow:0 0 0 4px rgba(246,197,96,.18)}
.ph b{display:block;font-size:14.5px}.ph small{color:var(--mu);font-size:12.5px}

/* focus */
.frun{text-align:center;padding-top:10px}
.frun h2{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.02em;margin:6px 0 18px;line-height:1.15}
.fring{width:min(76vw,290px);height:min(76vw,290px);margin:0 auto;position:relative}
.fring svg{width:100%;height:100%}
.fring .rbg{stroke-width:10}
.fring .rfg{stroke-width:10;transition:stroke-dashoffset 1s linear}
.fclock{position:absolute;inset:0;display:grid;place-content:center}
.fclock b{font-family:var(--serif);font-size:54px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.fclock span{color:var(--mu);font-size:13px;font-weight:600;margin-top:6px}
.fring.goal .rfg{stroke:var(--gold2);filter:drop-shadow(0 0 10px rgba(246,197,96,.8))}
.fctl{display:flex;gap:12px;justify-content:center;align-items:center;margin:26px 0 18px}
.round{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line2)}
.tip{font-family:var(--serif);font-style:italic;color:var(--mu);font-size:15px;margin:18px 10px 0}

/* me */
.me-top{display:flex;align-items:center;gap:16px}
.avatar{width:86px;height:86px;position:relative;flex:none}
.avatar .face{position:absolute;inset:9px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2a2860,#16173a);font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold2)}
.lvl{position:absolute;bottom:-2px;right:-2px;background:var(--gold);color:#1b1206;font-weight:800;font-size:11px;border-radius:99px;padding:3px 8px;border:2px solid var(--ink)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{padding:14px 8px 12px;border-radius:20px;text-align:center;background:var(--card);border:1px solid var(--line)}
.badge .bi{width:46px;height:46px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--mu2)}
.badge b{display:block;font-size:12px;line-height:1.25}
.badge small{display:block;font-size:10.5px;color:var(--mu);margin-top:3px;line-height:1.3}
.badge.ok{border-color:rgba(246,197,96,.3);background:linear-gradient(180deg,rgba(246,197,96,.1),rgba(246,197,96,.02))}
.badge.ok .bi{background:radial-gradient(circle at 35% 30%,#fff4d6,var(--gold) 55%,var(--gold3));color:#1b1206;box-shadow:0 0 20px rgba(246,197,96,.4)}
.badge:not(.ok){opacity:.55}
.list a,.list button.li{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);color:var(--tx);text-decoration:none;text-align:left}
.list a:last-child,.list button.li:last-child{border-bottom:0}
.li-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--gold2);flex:none}

const RANKS=['Spark','Ember','Kindle','Flame','Blaze','Comet','Meteor','Star','Nova','Constellation','Galaxy','Supernova'];
function XP(){const m=S.study.reduce((a,e)=>a+(+e.mins||0),0),tk=ticks(),pf=(S.set.pfd||[]).length,td=S.tasks.filter(e=>e.st==='Completed').length,rc=Object.values(S.set.rc||{}).reduce((a,b)=>a+(+b||0),0),rt=Object.values(S.road).filter(r=>r&&(r.st==='Completed'||r.st==='Mastered')).length;
  const x=Math.floor(m/3)+10*tk+50*pf+25*td+20*S.journal.length+2*rc+10*rt;const L=Math.floor(Math.sqrt(x/100))+1;return{x,m,L,lo:100*(L-1)**2,hi:100*L*L,rank:RANKS[Math.min(L-1,RANKS.length-1)],tk,pf,td,pt:planTotals()}}

 ['first','First light','Check off your first item',X.tk>0,'spark'],

 ['s21','Unbreakable','21-day streak',b>=21,'flame'],
 ['p1','Perfect day','Finish every item in a day',X.pf>=1,'stars'],
 ['p7','Perfectionist','7 perfect days',X.pf>=7,'stars'],
 ['f10','Deep work','10 focus hours',X.m>=600,'timer'],

function rewardCheck(prevL){const X=XP();if(prevL&&X.L>prevL){setTimeout(()=>{bigBurst();chime('perfect');toast('Level '+X.L+' · '+X.rank,'You levelled up. Keep going.','trophy')},700)}
  const ok=badges().filter(b=>b[3]).map(b=>b[0]),seen=S.set.bseen||[],nw=ok.filter(id=>!seen.includes(id));if(nw.length){S.set.bseen=[...new Set([...seen,...ok])];save('set');const bd=badges().find(b=>b[0]===nw[0]);setTimeout(()=>{burst(innerWidth/2,innerHeight*.25,30,6);toast('Badge unlocked: '+bd[1],bd[2],bd[4])},prevL&&X.L>prevL?3200:900)}}

let AC;const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function tone(f,t0,d,v=.07){const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function chime(k){if(S.set.sfx===false)return;try{if(k==='check'){tone(1046.5,0,.28);tone(1568,.07,.4,.05)}else if(k==='perfect'){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.09,.7,.06))}else if(k==='start'){tone(392,0,.5);tone(587.3,.14,.6,.05)}else if(k==='done'){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.08,.55,.06))}else if(k==='undo'){tone(523,0,.15,.04)}}catch(e){}}
const buzz=p=>{if(S.set.hap===false)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const FX={p:[],run:0};const COLS=['#f6c560','#ffe3a3','#b4a2ff','#6ee7d2','#ff8a9a','#ffffff'];
function fxSize(){const c=$('#fx'),d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;c.getContext('2d').setTransform(d,0,0,d,0,0)}
function burst(x,y,n=16,sp=4){if(RM)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=sp*(.35+Math.random());FX.p.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.6,l:1,s:1.6+Math.random()*2.6,c:COLS[i%COLS.length],r:Math.random()*6})}if(!FX.run){FX.run=1;requestAnimationFrame(fxLoop)}}
function fxLoop(){const c=$('#fx').getContext('2d');c.clearRect(0,0,innerWidth,innerHeight);FX.p=FX.p.filter(p=>p.l>0);for(const p of FX.p){p.x+=p.vx;p.y+=p.vy;p.vy+=.11;p.vx*=.985;p.l-=.015;p.r+=.08;c.save();c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.translate(p.x,p.y);c.rotate(p.r);c.beginPath();const s=p.s;c.moveTo(0,-2*s);c.quadraticCurveTo(0,0,2*s,0);c.quadraticCurveTo(0,0,0,2*s);c.quadraticCurveTo(0,0,-2*s,0);c.quadraticCurveTo(0,0,0,-2*s);c.fill();c.restore()}if(FX.p.length)requestAnimationFrame(fxLoop);else{FX.run=0;c.clearRect(0,0,innerWidth,innerHeight)}}
function bigBurst(){[.2,.5,.8].forEach((f,i)=>setTimeout(()=>burst(innerWidth*f,innerHeight*.32,42,7),i*160))}

const KEYS=()=>{const p=AP();return p?p.missions.map(m=>m.id):[]};
function weekNums(t){let a=0,b=0,f=0,pf=0,pw=0;for(let i=0;i<7;i++){const d=add(t,-i),[p,q]=cnt(d);a+=p;b+=q;f+=sm(d);if(p===q&&q)pf++;pw+=sm(add(t,-i-7))}return{a,b,f,pf,pw,pc:b?Math.round(100*a/b):0}}
function weekReport(){const t=today(),D=[0,1,2,3,4,5,6].map(i=>add(t,i-6)),x=planDay(t),p=AP(),W=weekNums(t),L=[];

  L.push('','TOTALS: '+W.a+'/'+W.b+' missions ('+W.pc+'%), '+W.pf+' perfect days, '+hm(W.f)+' focus (previous week '+hm(W.pw)+'). Current streak '+streak()+' days, best '+bestStreak()+'. Level '+XP().L+'.');
  const tr={};D.forEach(d=>items(d).forEach(i=>{const k=KEYS().includes(i.k)?MT(i.k).n:'Extra missions';tr[k]=tr[k]||[0,0];tr[k][1]++;if(isDone(d,i.k))tr[k][0]++}));L.push('BY MISSION: '+Object.entries(tr).map(([k,[a,b]])=>k+' '+a+'/'+b).join(', '));
  const bl=backlog();L.push('','CATCH-UP BACKLOG (catch-up missions from the last 14 days not done yet)');L.push(...(bl.length?bl.map(i=>'- '+lab(i.d)+': '+i.title):['- none']));

  if(p){L.push('','PLAN MISSIONS (key = mission)');p.missions.forEach(m=>L.push('- '+m.id+' = '+m.title+' ('+[m.days?m.days.map(i=>['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]).join('/'):'every day',m.time||'any time',m.mins?m.mins+' min':'',m.from||m.to?'days '+(m.from||1)+'-'+(m.to||p.days):''].filter(Boolean).join(', ')+')'))}
  L.push('','NEXT 7 DAYS AS PLANNED');for(let i=1;i<=7;i++){const d=add(t,i),z=planDay(d);L.push('- '+d+' '+lab(d,{weekday:'short'})+(z?' (Day '+(z.i+1)+')':'')+': '+(items(d).map(q=>(KEYS().includes(q.k)?q.k+'=':'')+q.title).join('; ')||'no missions')+(evOn(d).length?' · Events: '+evOn(d).map(e=>e.title+(e.time?' '+e.time:'')).join('; '):''))}
  if(S.set.px&&S.set.px.note)L.push('','LAST WEEK\'S COACH NOTE: '+S.set.px.note);
  const ks=KEYS(),k1=ks[0]||'KEY',k2=ks[1]||ks[0]||'KEY',d1=add(t,1),d2=add(t,2),ex={comeback_plan:1,note:'One sentence focus for the week.',days:{[d1]:{titles:{[k1]:'A more specific task for this mission'},skip:[k2],add:[{title:'Re-solve 5 loop problems',track:k1,time:'20:00',mins:45}],note:'Start with the hardest task.'},[d2]:{note:'Normal day. Protect sleep.'}}};
  L.push('','--- INSTRUCTIONS FOR CLAUDE ---','You are my study coach. Using the data above:','1. Tell me honestly how this week went, in 3 to 5 sentences. Be specific, not generic.','2. Name the ONE thing I should change next week.','3. Give me next week\'s plan adjustments as ONE json code block in exactly this format:','```json',JSON.stringify(ex,null,1),'```',
  'Rules: only include days that change. Dates are YYYY-MM-DD. Use the mission keys listed under PLAN MISSIONS. "titles" renames a mission that day, "skip" removes missions that day, "add" adds up to 8 extra missions (track = a mission key for its colour and icon; track, time HH:MM and mins are optional), "note" is a short coach message I see that morning. Spread missed work over upcoming days instead of doubling one day. For dates outside my plan, a day with "add" missions replaces my default habits. Keep "comeback_plan": 1.');

  const out={},tm=/^([01]?\d|2[0-3]):[0-5]\d$/;

    if(v.titles!=null){if(typeof v.titles!=='object'||Array.isArray(v.titles))return pxErr('"titles" must be an object on '+d);o.titles={};for(const[k,t]of Object.entries(v.titles)){if(!KEYS().includes(k)||typeof t!=='string'||!t.trim())return pxErr('Unknown mission "'+k+'" on '+d);o.titles[k]=t.trim().slice(0,140)}}

  <div class=card><b>Daily habits</b><p class=mu style="font-size:13px;margin:4px 0 10px">Shown on Today whenever no plan is active.</p><textarea class=field id=hbx>${esc(HB().join('\n'))}</textarea><button class="btn sm" style="margin-top:10px" onclick="const a=$('#hbx').value.split('\\n').map(x=>x.trim()).filter(Boolean).slice(0,8);if(!a.length)return toast('Keep at least one habit','','x');S.set.hb=a;save('set');toast('Habits saved','','check')">Save habits</button></div>
  <div class=card><b>Backup</b><p class=mu style="font-size:13px;margin:4px 0 12px">Your data lives only on this phone, in this browser. Export a backup every week.${S.set.lb?' Last: '+new Date(S.set.lb).toLocaleDateString('en-GB'):''}</p><div class=row style="flex-wrap:wrap;gap:8px"><button class="btn gold-b sm" onclick="bk()">${ic('download',15)} Export backup</button><label class="btn sm">Import backup<input type=file accept=".json,application/json" hidden onchange="imp(this)"></label></div>
  ${SN.length?`<details style="margin-top:14px"><summary class=mu style="font-size:13px;cursor:pointer">Daily safety copies (${SN.length})</summary>${SN.slice().reverse().map((x,i)=>`<div class=kv><span>${esc(x.d)} · ${Math.round(x.j.length/1024)} KB</span><button class=link onclick="rsn(${SN.length-1-i})">Restore</button></div>`).join('')}</details>`:''}<p class=mu2 style="font-size:12px;margin-top:10px">Storage protection: ${PERS?'on':'not granted (installing the app helps)'}</p></div>
  <div class=card><div class=row style="justify-content:space-between"><div><b>App PIN</b><p class=mu style="font-size:13px">Hides the app on this phone. It doesn't encrypt data.</p></div><button class="btn sm" onclick="sp()">${S.set.pin?'Change':'Set PIN'}</button></div></div>
  ${matchMedia('(display-mode: standalone)').matches?'':`<div class=card><b>Install</b><p class=mu style="font-size:13px;margin:4px 0 10px">Add Comeback to your home screen so it opens like an app.</p>${DP?'<button class="btn gold-b sm" onclick="DP.prompt()">Install app</button>':'<p class=mu2 style="font-size:12px">In Chrome, open the ⋮ menu and choose “Add to Home screen” or “Install app”.</p>'}</div>`}
  ${leg.length?`<div class=card><b>Older records</b><p class=mu style="font-size:13px;margin-top:4px">Kept safely and included in every backup, but no longer shown: ${leg.map(([k,n])=>n+' '+k).join(', ')}.</p></div>`:''}
  <p class=mu2 style="text-align:center;font-size:12px;margin-top:16px">Comeback v10 · data format 9 · works offline</p>`};
async function sp(){const p=prompt(S.set.pin?'New PIN (4–8 digits). Leave empty to remove it.':'Choose a PIN (4–8 digits). If you forget it, the only way in is clearing site data, which erases everything. Export a backup first.');if(p===null)return;if(p==='')delete S.set.pin;else{if(!/^\d{4,8}$/.test(p))return toast('Use 4 to 8 digits','','x');S.set.pin=await hsh(p)}save('set');go('settings',{keep:1});toast(S.set.pin?'PIN set':'PIN removed','','lockic')}
async function lock(){if(!S.set.pin)return;const o=document.createElement('div');o.className='lock';o.id='lk';o.innerHTML=`<div class=card style="width:min(90vw,340px);text-align:center"><div class=li-ic style="margin:0 auto 12px">${ic('lockic',20)}</div><h2 class=sh-title>Welcome back</h2><input class=field id=pn type=password inputmode=numeric autocomplete=off style="margin:16px 0 12px;text-align:center;font-size:22px;letter-spacing:.4em" onkeydown="if(event.key==='Enter')unl()"><button class="btn gold-b wide" onclick="unl()">Unlock</button></div>`;document.body.append(o);setTimeout(()=>$('#pn')&&$('#pn').focus(),100)}
async function unl(){if(await hsh($('#pn').value)===S.set.pin)$('#lk').remove();else{buzz([60,40,60]);$('#pn').value='';toast('Wrong PIN','','x')}}
function dl(n,t,y){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function bk(){S.set.lb=Date.now();save('set');dl('comeback-backup-'+ds()+'.json',JSON.stringify({app:'comeback-os',v:2,schema:SCHEMA,exported:new Date().toISOString(),data:S}),'application/json');toast('Backup downloaded','Keep it somewhere safe, like Google Drive.','download');setTimeout(()=>cur==='settings'&&go('settings',{keep:1}),300)}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=='comeback-os'||!j.data)throw Error('This is not a Comeback backup file.');for(const k of AR)if(j.data[k]!==undefined&&!Array.isArray(j.data[k]))throw Error('Backup is missing "'+k+'".');for(const k of OB)if(!j.data[k]||typeof j.data[k]!=='object'||Array.isArray(j.data[k]))throw Error('Backup is missing "'+k+'".');for(const k of AR)if((j.data[k]||[]).some(x=>!x||typeof x!=='object'||Array.isArray(x)))throw Error('"'+k+'" contains an unreadable record, so nothing was changed.');
  if(!confirm('Replace ALL current data with this backup? A copy of your current data is saved first and can be restored in Settings.'))return;SN.push({d:ds()+' (before import)',j:JSON.stringify(S)});SN=SN.slice(-9);put('snaps',SN);[...AR,...OB].forEach(k=>S[k]=j.data[k]||structuredClone(DEF[k]??[]));S.set.cd=S.set.cd||[0,3,6];AR.forEach(k=>S[k].forEach(x=>{if(!x.id)x.id=uid()}));saveAll();toast('Backup restored','','check');go('today')}catch(e){toast('Import failed',e.message,'x',6000)}};r.onerror=()=>toast('Could not read that file','','x');r.readAsText(f)}
function rsn(i){if(!confirm('Restore your data as it was on '+SN[i].d+'? Current data will be replaced (a copy is kept).'))return;const j=JSON.parse(SN[i].j);SN.push({d:ds()+' (before restore)',j:JSON.stringify(S)});SN=SN.slice(-9);put('snaps',SN);[...AR,...OB].forEach(k=>S[k]=j[k]||structuredClone(DEF[k]??[]));saveAll();toast('Restored','','check');go('today')}

/* ============ startup ============ */
async function metaInit(){try{let m=await get('meta');if(!m)m={schema:8,first:Date.now(),log:[]};if(m.schema<9){if(S.study.length+S.tasks.length+S.journal.length)put('premigration-backup',JSON.stringify({at:Date.now(),from:m.schema,data:S}));AR.forEach(k=>{S[k]=S[k].filter(r=>r&&typeof r==='object');S[k].forEach(r=>{if(!r.id)r.id=uid()});save(k)});m.schema=9;m.log.push({v:9,at:new Date().toISOString()})}put('meta',m)}catch(e){console.error(e)}}
async function snapInit(){try{PERS=navigator.storage&&navigator.storage.persist?await navigator.storage.persist():null}catch(e){}try{SN=(await get('snaps'))||[];if(!SN.some(x=>x.d===ds())){SN.push({d:ds(),j:JSON.stringify(S)});SN=SN.slice(-9);put('snaps',SN)}}catch(e){}}
(async()=>{fxSize();addEventListener('resize',fxSize);
  try{await idbOpen();for(const k of [...AR,...OB]){const v=await get(k);S[k]=v??structuredClone(DEF[k]??[]);if(AR.includes(k)&&!Array.isArray(S[k]))S[k]=[];}
    S.set.cd=S.set.cd||[0,3,6];await metaInit();AR.forEach(k=>{let ch=0;S[k]=S[k].filter(r=>r&&typeof r==='object');S[k].forEach(r=>{if(!r.id){r.id=uid();ch=1}});if(ch)save(k)});
    if(!S.set.plans){S.set.plans=[legacyPlan()];S.set.ap='p60';S.set.pfd=Object.keys(S.log).filter(d=>{const[a,b]=cnt(d);return b&&a===b});save('set')}
    if(!S.set.bseen){S.set.bseen=badges().filter(b=>b[3]).map(b=>b[0]);save('set')}
    const h=location.hash.slice(1);cur='';history.replaceState({v:V[h]?h:'today'},'');go(V[h]?h:'today',{pop:1});
    if(S.set.timer&&!S.set.timer.pausedAt)wake();
    await snapInit();await lock();
  }catch(e){console.error(e);$('#view').innerHTML='<div class=card><h2 class=sh-title>Storage unavailable</h2><p class=mu style="margin-top:8px">This browser blocked local storage, so nothing can be saved. Open the app in Chrome, outside private mode.</p></div>'}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  setInterval(()=>{if(cur==='today'&&!SHEET&&!document.hidden&&document.activeElement.tagName!=='INPUT')go('today',{keep:1})},60000);
})();
</script>
</body>
